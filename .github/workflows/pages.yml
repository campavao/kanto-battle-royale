name: pages

# Publishes site/ at the Pages root so the mod feed resolves at
# https://campavao.github.io/kanto-battle-royale/data/index.json --
# the URL src/mods/ModIndex.lua:66 asks for first. Until this existed it
# 404'd and every client fell back to raw.githubusercontent.
#
# workflow_call is here because the relay-stats job commits with the default
# GITHUB_TOKEN, and a push made with that token deliberately triggers nothing.
# Calling this workflow is a direct job invocation, so it sidesteps that.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published feed is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The branch tip, not github.sha. When relay-stats calls this right
      # after pushing a commit, github.sha is still the commit that TRIGGERED
      # the run -- one behind the file it just wrote -- so every publish was
      # shipping the previous stats.json and the page ran one update late.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
